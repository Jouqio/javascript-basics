<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>03 - DOM Traversal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>DOM Traversal</h1>
    <p>Buka Console (F12) untuk melihat hasil penjelajahan DOM.</p>

    <div class="parent">
      <p>Anak pertama</p>
      <p class="target">Anak kedua (target)</p>
      <p>Anak ketiga</p>
    </div>

    <h2>Demo: Hapus item lewat traversal</h2>
    <ul id="daftar">
      <li>Item A <button class="btn-hapus">Hapus</button></li>
      <li>Item B <button class="btn-hapus">Hapus</button></li>
      <li>Item C <button class="btn-hapus">Hapus</button></li>
    </ul>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
