<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>06 - Mengubah Style dan Class</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Mengubah Style dan Class</h1>

    <div class="kotak" id="kotak">Kotak Demo</div>
    <button id="btn-style-langsung">Ubah lewat style langsung</button>
    <button id="btn-class">Toggle class "aktif"</button>

    <h2>Demo: Progress Bar (pakai style dinamis)</h2>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <button id="btn-progress">Tambah 10%</button>

    <h2>Demo: Dark Mode Toggle</h2>
    <button id="btn-tema">Ganti Tema</button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
