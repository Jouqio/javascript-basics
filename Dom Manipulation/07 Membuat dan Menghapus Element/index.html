<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>07 - Membuat dan Menghapus Element</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Membuat dan Menghapus Element</h1>

    <div class="form-tambah">
      <input type="text" id="input-item" placeholder="Tulis item baru...">
      <button id="btn-tambah">Tambah</button>
    </div>

    <ul id="daftar">
      <li>Item awal 1</li>
      <li>Item awal 2</li>
    </ul>

    <p class="hint">Klik item untuk menghapusnya</p>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
