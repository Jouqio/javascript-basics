<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>08 - Event Handling Dasar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Event Handling Dasar</h1>

    <button id="btn-klik">Klik Saya</button>

    <div class="hover-box" id="hover-box">Arahkan mouse ke sini</div>

    <h2>Live preview lewat event "input"</h2>
    <input type="text" id="input-nama" placeholder="Ketik nama kamu...">
    <p id="hasil">Halo, ...</p>

    <h2>Event keyboard</h2>
    <p>Tekan tombol apapun di keyboard (setelah klik area ini): <span id="tombol-ditekan">-</span></p>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
