<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Contoh: Atribut async</title>
<script src="pesan.js" async></script>
</head>
<body>
  <h1>2. Script dengan <code>async</code></h1>
  <p>Tag: <code>&lt;script src="pesan.js" async&gt;&lt;/script&gt;</code></p>
  <p>Browser lanjut baca HTML SAMBIL download pesan.js di belakang
  layar. Begitu selesai download, langsung dijalankan — walau
  proses baca HTML belum tentu kelar. Buka Console (F12) buat lihat
  pesannya.</p>
</body>
</html>
