<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Contoh: Atribut defer</title>
<script src="pesan.js" defer></script>
</head>
<body>
  <h1>3. Script dengan <code>defer</code></h1>
  <p>Tag: <code>&lt;script src="pesan.js" defer&gt;&lt;/script&gt;</code></p>
  <p>Browser lanjut baca HTML SAMBIL download pesan.js di belakang
  layar (sama seperti async), tapi BARU DIJALANKAN setelah seluruh
  HTML selesai dibaca. Buka Console (F12) buat lihat pesannya.</p>
</body>
</html>
