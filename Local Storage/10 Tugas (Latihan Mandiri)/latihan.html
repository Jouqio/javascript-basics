<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan - Local Storage</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; background: #f4f6f8; }
    button { padding: 10px 16px; border: none; border-radius: 6px; background: #4CAF50; color: white; cursor: pointer; margin-bottom: 8px; display: block; width: 100%; }
    p { color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Latihan localStorage</h1>
  <p>Buka DevTools (F12) → tab <b>Console</b> sebelum klik tombol di bawah untuk melihat hasilnya.</p>

  <button id="btnJalankan">Jalankan Semua Tes (jalankanSemuaTes)</button>
  <button id="btnReset">Reset Semua Data localStorage</button>

  <script src="latihan.js"></script>
  <script>
    document.getElementById("btnJalankan").addEventListener("click", function () {
      console.clear();
      jalankanSemuaTes();
    });

    document.getElementById("btnReset").addEventListener("click", function () {
      localStorage.clear();
      console.log("Semua data localStorage sudah direset.");
    });
  </script>

</body>
</html>
