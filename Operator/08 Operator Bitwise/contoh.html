<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>08 - Operator Bitwise</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; background: #f4f6f8; }
    input { padding: 8px; width: 30%; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 16px; border: none; border-radius: 6px; background: #795548; color: white; cursor: pointer; margin: 4px 0; display: block; width: 100%; }
    #hasil { margin-top: 16px; background: white; padding: 12px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h1>Operator Bitwise</h1>

  <label>Angka A: </label><input type="number" id="inputA" value="5">
  <label>Angka B: </label><input type="number" id="inputB" value="3">

  <button id="btnHitung">Hitung Semua Operasi Bitwise</button>
  <button id="btnShift">Demo Left/Right Shift (Trik Kali/Bagi 2)</button>

  <div id="hasil"></div>

  <script>
    const hasil = document.getElementById("hasil");

    function keBiner8bit(n) {
      return (n >>> 0).toString(2).padStart(8, "0").slice(-8);
    }

    document.getElementById("btnHitung").addEventListener("click", function () {
      const a = Number(document.getElementById("inputA").value);
      const b = Number(document.getElementById("inputB").value);

      hasil.textContent =
        "A = " + a + " (biner: " + keBiner8bit(a) + ")\n" +
        "B = " + b + " (biner: " + keBiner8bit(b) + ")\n\n" +
        "A & B  = " + (a & b) + "  (biner: " + keBiner8bit(a & b) + ")\n" +
        "A | B  = " + (a | b) + "  (biner: " + keBiner8bit(a | b) + ")\n" +
        "A ^ B  = " + (a ^ b) + "  (biner: " + keBiner8bit(a ^ b) + ")\n" +
        "~A     = " + (~a) + " (membalik semua bit A)";
    });

    document.getElementById("btnShift").addEventListener("click", function () {
      const a = Number(document.getElementById("inputA").value);

      hasil.textContent =
        "A = " + a + "\n\n" +
        "A << 1  = " + (a << 1) + "  (setara A * 2)\n" +
        "A << 2  = " + (a << 2) + "  (setara A * 4)\n" +
        "A >> 1  = " + (a >> 1) + "  (setara Math.floor(A / 2))\n" +
        "A >> 2  = " + (a >> 2) + "  (setara Math.floor(A / 4))\n\n" +
        "Trik ~~ mirip Math.floor untuk angka positif:\n" +
        "~~4.7 = " + (~~4.7) + " (sama seperti Math.floor(4.7) = " + Math.floor(4.7) + ")";
    });
  </script>

</body>
</html>
